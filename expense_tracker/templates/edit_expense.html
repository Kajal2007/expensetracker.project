{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}

{% block content %}
<h1>Edit Expense #{{ expense['id'] }}</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="POST" action="{{ url_for('edit_expense', expense_id=expense['id']) }}" class="form">
    <label for="title">Expense Title</label>
    <input type="text" id="title" name="title" value="{{ expense['title'] }}" required>

    <label for="amount">Amount</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
           value="{{ expense['amount'] }}" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        {% for category in categories %}
        <option value="{{ category }}" {% if expense['category'] == category %}selected{% endif %}>
            {{ category }}
        </option>
        {% endfor %}
    </select>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ expense['date'] }}" required>

    <label for="note">Short Note</label>
    <textarea id="note" name="note" rows="3">{{ expense['note'] or '' }}</textarea>

    <button type="submit" class="btn">Save Changes</button>
    <a href="{{ url_for('expenses_list') }}" class="btn btn-grey">Cancel</a>
</form>
{% endblock %}
