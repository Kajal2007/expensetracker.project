{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}

{% block content %}
<h1>Add Expense</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="POST" action="{{ url_for('add_expense') }}" class="form">
    <label for="title">Expense Title</label>
    <input type="text" id="title" name="title" value="{{ form.get('title', '') }}" required>

    <label for="amount">Amount</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01"
           value="{{ form.get('amount', '') }}" required>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        {% for category in categories %}
        <option value="{{ category }}" {% if form.get('category') == category %}selected{% endif %}>
            {{ category }}
        </option>
        {% endfor %}
    </select>

    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ form.get('date', today) }}" required>

    <label for="note">Short Note</label>
    <textarea id="note" name="note" rows="3">{{ form.get('note', '') }}</textarea>

    <button type="submit" class="btn">Add Expense</button>
</form>
{% endblock %}
